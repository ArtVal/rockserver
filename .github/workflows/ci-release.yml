name: RockServer CI and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the verified image to the configured package registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: rockserver

jobs:
  verify:
    name: Verify and build immutable image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Run required Rust checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Build commit-SHA image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            .
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${IMAGE_NAME}:sha-${GITHUB_SHA}")" = "${GITHUB_SHA}"

      - name: Run image readiness smoke through local Compose
        shell: bash
        run: |
          set -euo pipefail
          export ROCKSERVER_IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          export ROCKSERVER_DOMAIN=localhost
          export ROCKSERVER_LOCAL_HTTP_PORT=18080
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export DATABASE_URL="postgres://rockserver:${POSTGRES_PASSWORD}@postgres:5432/rockserver"
          export ROCKSERVER_API_BEARER_TOKEN="$(openssl rand -hex 32)"
          project="rockserver-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker compose --project-name "${project}" --env-file .env.example \
              --file deploy/compose.yaml --file deploy/compose.local.yaml down \
              --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker compose --project-name "${project}" --env-file .env.example \
            --file deploy/compose.yaml --file deploy/compose.local.yaml config --quiet
          docker compose --project-name "${project}" --env-file .env.example \
            --file deploy/compose.yaml --file deploy/compose.local.yaml up --detach --wait
          curl --fail --silent --show-error http://127.0.0.1:18080/health/ready >/dev/null

  publish:
    name: Publish approved immutable image
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image == true
    runs-on: ubuntu-latest
    environment: release-gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish commit-SHA image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          docker buildx build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${image}:${GITHUB_SHA}" \
            --push \
            .
          docker buildx imagetools inspect "${image}:${GITHUB_SHA}" | sed -n '1,12p'
